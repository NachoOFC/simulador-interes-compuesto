<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Interés Compuesto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <h2>📈 Calculadora Diario</h2>

    <div class="layout">
        <div class="panel-form">
            <div class="form-group">
                <label for="monto">Monto Inicial ($):</label>
                <input type="text" id="monto" inputmode="numeric" value="1.000.000" placeholder="Ej. 1.000.000" oninput="formatearMonto()">
            </div>

            <div class="form-group">
                <label for="institucion">Selecciona Institución:</label>
                <select id="institucion" onchange="actualizarTasa()">
                    <option value="5.0">Mercado Pago (5.0% anual)</option>
                    <option value="4.6">MACH (Cuenta Futuro) (4.6% anual)</option>
                    <option value="personalizado">Otra (Tasa personalizada)</option>
                </select>
            </div>

            <div class="form-group oculto" id="grupo-tasa-manual">
                <label for="tasa">Tasa Anual (%):</label>
                <input type="number" id="tasa" step="0.1" value="5.0">
            </div>

            <div class="form-group">
                <label for="dias">Plazo en días:</label>
                <input type="number" id="dias" value="30" placeholder="Ej. 30">
            </div>

            <button onclick="calcularInteres()">Calcular Ganancia</button>
        </div>

        <div class="panel-resultados">
            <div class="grid-resumen oculto" id="resultado">
                <div class="result">
                    <p>Monto Final</p>
                    <p class="highlight" id="monto-final">$0</p>
                </div>
                <div class="result">
                    <p>Total Ganado</p>
                    <p class="highlight" id="total-ganado">$0</p>
                </div>
                <div class="result">
                    <p>Ganancia último día</p>
                    <p class="highlight" id="ultimo-dia">$0</p>
                </div>
            </div>

            <div class="grafico-wrapper oculto" id="grafico">
                <svg id="grafico-svg" viewBox="0 0 600 300"></svg>
            </div>

            <div class="result oculto" id="tabla-dias">
                <p><strong>Evolución diaria:</strong></p>
                <div class="tabla-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Día</th>
                                <th>Interés del día</th>
                                <th>Saldo acumulado</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-tabla"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
